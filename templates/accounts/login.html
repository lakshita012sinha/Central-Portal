<!DOCTYPE html>
<html>
<head>
    <title>Central Portal Login</title>
</head>
<body>

    <h2>Central Portal Login</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >

        <div>
            <label>Username</label>
            <input
                type="text"
                name="username"
                value="{{ username|default:'' }}"
                required
            >
        </div>

        <div>
            <label>Password</label>
            <input
                type="password"
                name="password"
                required
            >
        </div>

        <button type="submit">
            Login
        </button>
    </form>

</body>
</html>
