<!DOCTYPE html>
<html>
<head>
    <title>Change Password - Central Portal</title>
</head>
<body>

    <h2>Change Password</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p style="color: green;">{{ success }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label>Current Password</label>
            <input
                type="password"
                name="old_password"
                required
            >
        </div>

        <div>
            <label>New Password</label>
            <input
                type="password"
                name="new_password"
                required
            >
        </div>

        <div>
            <label>Confirm New Password</label>
            <input
                type="password"
                name="confirm_password"
                required
            >
        </div>

        <button type="submit">
            Change Password
        </button>
    </form>

</body>
</html>
